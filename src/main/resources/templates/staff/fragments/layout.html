<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="vi">
<body>
<aside th:fragment="sidebar(active)" class="sidebar">
    <div>
        <div class="brand">
            <img class="brand-logo" src="/images/logo.jpg" alt="Logo Trạm Truyện">
            <span>Trạm Truyện</span>
            <small style="background: rgba(135,82,0,0.15); color: #875200; padding: 2px 6px; border-radius: 4px; font-weight: 700; font-size: 10px;">Nhân viên</small>
        </div>
        <nav>
            <a class="nav-link" th:classappend="${active == 'truyen' ? ' active' : ''}" th:href="@{/staff/novels}"><span>▤</span> Truyện</a>
            <a class="nav-link" th:classappend="${active == 'the-loai' ? ' active' : ''}" th:href="@{/staff/categories}"><span>◈</span> Thể loại</a>
            <a class="nav-link" th:classappend="${active == 'bao-cao' ? ' active' : ''}" th:href="@{/staff/reports}"><span>⚑</span> Báo cáo</a>
            <a class="nav-link" th:classappend="${active == 'trang-chu' ? ' active' : ''}" th:href="@{/}"><span>⮌</span> Về trang chủ</a>
        </nav>
    </div>
    <div class="sidebar-footer">
        <strong sec:authorize="isAuthenticated()" sec:authentication="principal.user.fullName">NHÂN VIÊN CMS</strong>
        <strong sec:authorize="!isAuthenticated()">NHÂN VIÊN CMS</strong>
        
        <span sec:authorize="isAuthenticated()" sec:authentication="principal.user.email">Biên tập & Kiểm duyệt</span>
        <span sec:authorize="!isAuthenticated()">Biên tập & Kiểm duyệt</span>
        
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="admin-logout-form">
            <button type="submit" class="admin-logout-btn">
                Đăng xuất
            </button>
        </form>
    </div>
</aside>

<header th:fragment="topbar" class="topbar">
    <span class="search-hint">⌕ &nbsp; Bàn làm việc biên tập và kiểm duyệt nội dung</span>
    <span class="profile">Nhân viên biên tập <b>NV</b></span>
</header>

<!-- Fragment Toast thông báo thao tác cho Nhân viên -->
<div th:fragment="flash-toast"
     th:if="${successMessage != null or errorMessage != null or infoMessage != null}" 
     id="admin-toast" class="fixed top-20 right-6 z-[100] flex flex-col gap-3 animate-fade-in pointer-events-none">
    
    <!-- Success Toast -->
    <div th:if="${successMessage != null}" 
         class="bg-[#faf6f0] border-l-4 border-[#875200] rounded-r-xl p-4 text-[#2b2118] flex items-start gap-3 shadow-lg max-w-sm pointer-events-auto">
        <span class="material-symbols-outlined text-[#875200] text-[24px] mt-0.5">check_circle</span>
        <div class="flex flex-col">
            <span class="text-xs font-bold leading-relaxed" th:text="${successMessage}">Thành công</span>
        </div>
        <button type="button" onclick="this.parentElement.remove()" class="text-[#8a7664] hover:text-[#2b2118] transition-colors ml-auto">
            <span class="material-symbols-outlined text-[20px]">close</span>
        </button>
    </div>

    <!-- Info Toast -->
    <div th:if="${infoMessage != null}" 
         class="bg-[#faf7f2] border-l-4 border-[#bc7d39] rounded-r-xl p-4 text-[#2b2118] flex items-start gap-3 shadow-lg max-w-sm pointer-events-auto">
        <span class="material-symbols-outlined text-[#bc7d39] text-[24px] mt-0.5">info</span>
        <div class="flex flex-col">
            <span class="text-xs font-bold leading-relaxed" th:text="${infoMessage}">Thông tin</span>
        </div>
        <button type="button" onclick="this.parentElement.remove()" class="text-[#8a7664] hover:text-[#2b2118] transition-colors ml-auto">
            <span class="material-symbols-outlined text-[20px]">close</span>
        </button>
    </div>

    <!-- Error Toast -->
    <div th:if="${errorMessage != null}" 
         class="bg-[#fff4f2] border-l-4 border-[#9e422c] rounded-r-xl p-4 text-[#7e2b17] flex items-start gap-3 shadow-lg max-w-sm pointer-events-auto">
        <span class="material-symbols-outlined text-[#9e422c] text-[24px] mt-0.5">error</span>
        <div class="flex flex-col">
            <span class="text-xs font-bold leading-relaxed" th:text="${errorMessage}">Lỗi</span>
        </div>
        <button type="button" onclick="this.parentElement.remove()" class="text-[#9e422c] opacity-70 hover:opacity-100 transition-opacity ml-auto">
            <span class="material-symbols-outlined text-[20px]">close</span>
        </button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                const toast = document.getElementById('admin-toast');
                if (toast) {
                    toast.style.opacity = '0';
                    toast.style.transition = 'opacity 0.5s ease';
                    setTimeout(() => toast.remove(), 500);
                }
            }, 5000);
        });
    </script>
</div>
</body>
</html>
