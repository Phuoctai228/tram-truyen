<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi" class="h-full">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${category.name + ' | Trạm Truyện'}">Thể loại | Trạm Truyện</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/home/home-ui.css}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/home/tailwind-config.js}"></script>
</head>

<body class="bg-background font-body-md text-on-surface flex flex-col min-h-screen">

    <div th:replace="~{fragments/header :: main-header}"></div>
    <div class="h-20"></div>

    <main class="flex-grow max-w-7xl mx-auto px-6 lg:px-12 py-10 w-full">
        <!-- Breadcrumb & Back -->
        <div class="mb-6 flex items-center gap-4">
            <a th:href="@{/the-loai}"
                class="inline-flex items-center gap-1.5 text-primary hover:text-on-primary-container transition-colors font-medium text-[14px]">
                <span class="material-symbols-outlined text-[18px]">arrow_back</span>
                <span>Trở lại danh sách Thể loại</span>
            </a>
        </div>

        <!-- Category Header -->
        <div
            class="bg-surface-container-low rounded-2xl p-6 md:p-8 shadow-sm border border-outline-variant/30 mb-8">
            <div class="flex items-center gap-2.5 mb-2.5">
                <span class="material-symbols-outlined text-primary text-[22px]">bookmark</span>
                <span class="text-[12px] font-bold text-primary tracking-widest uppercase">Danh mục thể loại</span>
            </div>
            <h1 class="text-2xl md:text-4xl font-bold text-on-surface mb-2" th:text="${category.name}">Tên thể loại</h1>
            <p class="text-[12px] font-bold text-secondary uppercase tracking-wider mb-3" th:text="${(category.novelCount != null ? category.novelCount : 0) + ' TÁC PHẨM'}">0 TÁC PHẨM</p>
            <p class="text-[14px] md:text-[15px] text-tertiary max-w-3xl leading-relaxed"
                th:text="${category.description != null ? category.description : 'Khám phá thế giới của những tác phẩm trong thể loại này.'}">
            </p>
        </div>

        <!-- Empty State (No novels yet) -->
        <div th:if="${novels.isEmpty()}" class="text-center py-20 bg-surface-container-lowest rounded-2xl border border-dashed border-outline-variant/50">
            <span class="material-symbols-outlined text-[56px] text-outline/50 mb-3">auto_stories</span>
            <h3 class="text-[18px] font-semibold text-on-surface mb-2">Chưa có truyện nào</h3>
            <p class="text-secondary text-sm">Hiện tại chưa có tác phẩm nào được liên kết với thể loại này.</p>
        </div>

        <!-- Novels Grid: Classic Home Card Style (6 columns) -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4" th:if="${!novels.isEmpty()}">
            <article th:each="novel : ${novels}"
                class="group flex flex-col p-3 rounded-xl bg-surface-container-lowest border border-outline-variant/30 shadow-[0_2px_12px_rgba(107,91,75,0.05)] hover:shadow-[0_8px_24px_rgba(107,91,75,0.12)] transition-all">
                <!-- Cover with Views & Chapter count overlay -->
                <a th:href="@{'/truyen/' + ${novel.slug}}"
                    class="relative w-full aspect-[3/4] rounded-lg overflow-hidden mb-2.5 bg-surface-container block group-hover:opacity-95">
                    <img class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
                        th:src="${novel.coverUrl != null ? novel.coverUrl : '/images/default-cover.jpg'}"
                        onerror="this.onerror=null;this.src='/images/default-cover.jpg';"
                        th:alt="${novel.title}">
                    <!-- Overlay: Views & Chapter count at bottom of cover -->
                    <div
                        class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/85 via-black/45 to-transparent pt-6 pb-1.5 px-2 flex items-center justify-between text-white font-label-sm text-[11px] leading-tight select-none">
                        <span class="flex items-center gap-1 opacity-90 truncate" title="Lượt xem">
                            <span class="material-symbols-outlined text-[13px]">visibility</span>
                            <span th:text="${novel.views != null ? #numbers.formatInteger(novel.views, 1, 'POINT') : '0'}">0</span>
                        </span>
                        <span class="flex items-center gap-1 opacity-90 truncate ml-1.5" title="Số chương">
                            <span class="material-symbols-outlined text-[13px] text-primary-fixed">menu_book</span>
                            <span th:text="${(novel.chapterCount != null ? novel.chapterCount : 0) + ' ch.'}">0 ch.</span>
                        </span>
                    </div>
                    <!-- Badge if completed -->
                    <div th:if="${novel.status == 'COMPLETED'}"
                        class="absolute top-2 left-2 px-1.5 py-0.5 rounded text-[10px] font-bold bg-[#43a047] text-white select-none shadow-sm">
                        HOÀN THÀNH
                    </div>
                </a>

                <!-- Novel Title: 2 lines clamped with fixed min-height for uniform alignment -->
                <a th:href="@{'/truyen/' + ${novel.slug}}"
                    class="font-headline-sm text-[14px] leading-tight font-bold text-on-surface group-hover:text-primary transition-colors line-clamp-2 min-h-[34px] mb-1"
                    th:text="${novel.title}">Tên truyện</a>

                <!-- Author & Rating Row -->
                <div class="flex items-center justify-between text-label-sm text-secondary mb-2">
                    <p class="font-body-md truncate flex-1" th:text="${novel.author}">Tác giả</p>
                    <span class="flex items-center gap-0.5 text-primary shrink-0 ml-1.5"
                        th:if="${novel.averageRating != null and novel.averageRating > 0}">
                        <span class="material-symbols-outlined text-[12px] icon-fill">star</span>
                        <span class="font-bold text-[11px]" th:text="${novel.averageRating}">4.9</span>
                    </span>
                </div>

                <!-- Card Footer: Status & Read link -->
                <div class="mt-auto pt-2 border-t border-outline-variant/20 flex items-center justify-between text-[11px]">
                    <span class="text-secondary font-medium" th:text="${novel.status == 'COMPLETED' ? 'Đã hoàn thành' : 'Đang ra'}">Đang ra</span>
                    <a th:href="@{'/truyen/' + ${novel.slug}}" class="text-primary font-bold hover:underline flex items-center gap-0.5">
                        <span>Đọc ngay</span>
                        <span class="material-symbols-outlined text-[12px]">chevron_right</span>
                    </a>
                </div>
            </article>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: main-footer}"></div>

</body>

</html>
