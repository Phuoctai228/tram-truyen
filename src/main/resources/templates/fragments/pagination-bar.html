<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<body>

<!--
    Fragment thanh phân trang chuẩn hóa Trạm Truyện (Mô hình 3 khối ngang: Hiển thị a-b / Số dòng trên trang / Cụm nút điều hướng).
    Tham số:
      - baseUrl: URL cơ sở (ví dụ '/admin/users', '/user/mailbox')
      - currentPage: số trang hiện tại (0-indexed)
      - totalPages: tổng số trang
      - totalElements: tổng số bản ghi
      - pageSize: số bản ghi trên một trang (7, 10, 15, 20)
      - unitLabel: danh từ hiển thị ('người dùng', 'thư', 'thông báo', 'báo cáo', 'giao dịch', 'bản ghi')
      - filterQuery: chuỗi query chứa mọi tham số lọc đã được mã hóa UTF-8 (không bao gồm page và size)
-->
<div th:fragment="pagination(baseUrl, currentPage, totalPages, totalElements, pageSize, unitLabel, filterQuery)"
     th:with="hasRecords = (${totalElements != null and totalElements > 0}),
              startRec = (${!hasRecords ? 0 : ((currentPage * 1L * pageSize) + 1)}),
              endRec = (${!hasRecords ? 0 : T(java.lang.Math).min(((currentPage + 1) * 1L * pageSize), totalElements)}),
              hasPrev = (${currentPage != null and currentPage > 0}),
              hasNext = (${totalPages != null and totalPages > 1 and currentPage < totalPages - 1})"
     class="px-6 py-4 bg-[#fffaf8] border-t border-[#ead8cb] flex flex-col md:flex-row items-center justify-between gap-4 text-xs font-sans">

    <!-- 1. KHỐI TRÁI: Đang hiển thị a - b trên tổng số N [unitLabel] -->
    <div class="text-[#75695d] shrink-0 text-center md:text-left">
        <span th:if="${hasRecords}">
            Đang hiển thị <span class="font-bold text-[#231a11]" th:text="${startRec}">1</span>
            - <span class="font-bold text-[#231a11]" th:text="${endRec}">10</span>
            trên tổng số <span class="font-bold text-[#231a11]" th:text="${#numbers.formatInteger(totalElements, 0, 'POINT')}">100</span>
            <span th:text="${unitLabel != null ? unitLabel : 'bản ghi'}">bản ghi</span>
        </span>
        <span th:unless="${hasRecords}">
            Đang hiển thị <span class="font-bold text-[#231a11]">0</span>
            - <span class="font-bold text-[#231a11]">0</span>
            trên tổng số <span class="font-bold text-[#231a11]">0</span>
            <span th:text="${unitLabel != null ? unitLabel : 'bản ghi'}">bản ghi</span>
        </span>
    </div>

    <!-- 2. KHỐI GIỮA: Số dòng / trang: [7 | 10 | 15 | 20] -->
    <div class="flex items-center gap-2 text-[#75695d] shrink-0">
        <label class="whitespace-nowrap font-medium text-xs">Số dòng / trang:</label>
        <select onchange="if(this.value) window.location.href=this.value;"
                class="bg-white border border-[#ead8cb] rounded-lg px-2.5 py-1 text-xs font-semibold text-[#231a11] outline-none focus:border-[#875200] cursor-pointer shadow-sm transition-colors">
            <option th:value="@{${baseUrl}(page=0, size=7)} + (${filterQuery != null and !filterQuery.isEmpty() ? '&amp;' + filterQuery : ''})"
                    th:selected="${pageSize == 7}">7</option>
            <option th:value="@{${baseUrl}(page=0, size=10)} + (${filterQuery != null and !filterQuery.isEmpty() ? '&amp;' + filterQuery : ''})"
                    th:selected="${pageSize == 10}">10</option>
            <option th:value="@{${baseUrl}(page=0, size=15)} + (${filterQuery != null and !filterQuery.isEmpty() ? '&amp;' + filterQuery : ''})"
                    th:selected="${pageSize == 15}">15</option>
            <option th:value="@{${baseUrl}(page=0, size=20)} + (${filterQuery != null and !filterQuery.isEmpty() ? '&amp;' + filterQuery : ''})"
                    th:selected="${pageSize == 20}">20</option>
        </select>
    </div>

    <!-- 3. KHỐI PHẢI: Cụm nút điều hướng (|<  <  1 2 3 ... 143  >  >|) -->
    <div class="flex items-center gap-1.5 shrink-0">
        <!-- Nút Về trang đầu (|<) -->
        <a th:if="${hasPrev}"
           th:href="@{${baseUrl}(page=0, size=${pageSize})} + (${filterQuery != null and !filterQuery.isEmpty() ? '&amp;' + filterQuery : ''})"
           title="Trang đầu"
           class="w-8 h-8 rounded-lg border border-[#ead8cb] bg-white flex items-center justify-center text-xs font-bold text-[#524437] hover:bg-[#feeadc] hover:text-[#875200] transition-colors">
            |&lt;
        </a>
        <span th:unless="${hasPrev}"
              title="Trang đầu"
              class="w-8 h-8 rounded-lg border border-[#ead8cb] bg-gray-50 flex items-center justify-center text-xs font-bold text-gray-300 cursor-not-allowed">
            |&lt;
        </span>

        <!-- Nút Trang trước (<) -->
        <a th:if="${hasPrev}"
           th:href="@{${baseUrl}(page=${currentPage - 1}, size=${pageSize})} + (${filterQuery != null and !filterQuery.isEmpty() ? '&amp;' + filterQuery : ''})"
           title="Trang trước"
           class="w-8 h-8 rounded-lg border border-[#ead8cb] bg-white flex items-center justify-center text-xs font-bold text-[#524437] hover:bg-[#feeadc] hover:text-[#875200] transition-colors">
            &lt;
        </a>
        <span th:unless="${hasPrev}"
              title="Trang trước"
              class="w-8 h-8 rounded-lg border border-[#ead8cb] bg-gray-50 flex items-center justify-center text-xs font-bold text-gray-300 cursor-not-allowed">
            &lt;
        </span>

        <!-- Dãy số trang -->
        <!-- Trường hợp 1: Chỉ có 1 trang duy nhất hoặc chưa có dữ liệu -->
        <th:block th:if="${totalPages == null or totalPages <= 1}">
            <span class="w-8 h-8 rounded-lg bg-[#875200] text-white flex items-center justify-center text-xs font-bold shadow-sm">
                1
            </span>
        </th:block>

        <!-- Trường hợp 2: Có nhiều hơn 1 trang -->
        <th:block th:if="${totalPages != null and totalPages > 1}">
            <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                <!-- Hiển thị trang 1, trang cuối, window quanh currentPage (cộng trừ 1), và mở rộng trang 3 khi ở trang đầu hoặc trang kế cuối khi ở cuối -->
                <th:block th:if="${i == 0 or i == totalPages - 1 or (i >= currentPage - 1 and i <= currentPage + 1) or (currentPage == 0 and i == 2) or (currentPage == totalPages - 1 and i == totalPages - 3)}">
                    <a th:href="@{${baseUrl}(page=${i}, size=${pageSize})} + (${filterQuery != null and !filterQuery.isEmpty() ? '&amp;' + filterQuery : ''})"
                       th:text="${i + 1}"
                       class="w-8 h-8 rounded-lg flex items-center justify-center text-xs font-bold transition-colors"
                       th:classappend="${i == currentPage ? 'bg-[#875200] text-white shadow-sm' : 'border border-[#ead8cb] bg-white text-[#524437] hover:bg-[#feeadc] hover:text-[#875200]'}">
                        1
                    </a>
                </th:block>

                <!-- Dấu '...' khi có khoảng trống ở bên trái -->
                <th:block th:if="${i == 1 and currentPage > 2}">
                    <span class="w-8 h-8 flex items-center justify-center text-xs font-bold text-[#a09081]">...</span>
                </th:block>

                <!-- Dấu '...' khi có khoảng trống ở bên phải -->
                <th:block th:if="${i == totalPages - 2 and currentPage < totalPages - 3}">
                    <span class="w-8 h-8 flex items-center justify-center text-xs font-bold text-[#a09081]">...</span>
                </th:block>
            </th:block>
        </th:block>

        <!-- Nút Trang sau (>) -->
        <a th:if="${hasNext}"
           th:href="@{${baseUrl}(page=${currentPage + 1}, size=${pageSize})} + (${filterQuery != null and !filterQuery.isEmpty() ? '&amp;' + filterQuery : ''})"
           title="Trang sau"
           class="w-8 h-8 rounded-lg border border-[#ead8cb] bg-white flex items-center justify-center text-xs font-bold text-[#524437] hover:bg-[#feeadc] hover:text-[#875200] transition-colors">
            &gt;
        </a>
        <span th:unless="${hasNext}"
              title="Trang sau"
              class="w-8 h-8 rounded-lg border border-[#ead8cb] bg-gray-50 flex items-center justify-center text-xs font-bold text-gray-300 cursor-not-allowed">
            &gt;
        </span>

        <!-- Nút Về trang cuối (>|) -->
        <a th:if="${hasNext}"
           th:href="@{${baseUrl}(page=${totalPages - 1}, size=${pageSize})} + (${filterQuery != null and !filterQuery.isEmpty() ? '&amp;' + filterQuery : ''})"
           title="Trang cuối"
           class="w-8 h-8 rounded-lg border border-[#ead8cb] bg-white flex items-center justify-center text-xs font-bold text-[#524437] hover:bg-[#feeadc] hover:text-[#875200] transition-colors">
            &gt;|
        </a>
        <span th:unless="${hasNext}"
              title="Trang cuối"
              class="w-8 h-8 rounded-lg border border-[#ead8cb] bg-gray-50 flex items-center justify-center text-xs font-bold text-gray-300 cursor-not-allowed">
            &gt;|
        </span>
    </div>
</div>

</body>
</html>
