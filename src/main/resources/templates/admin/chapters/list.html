<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý chương | Trạm Truyện</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/novel-admin.css}">
</head>
<body>
<div th:replace="~{admin/fragments/layout :: sidebar('chuong')}"></div>
<div class="page-shell">
    <div th:replace="~{admin/fragments/layout :: topbar}"></div>
    <main class="content chapter-list-content">
        <a class="back-link" th:href="@{/admin/novels}">← Quay lại danh sách truyện</a>
        <div class="page-heading chapter-heading"><div><p class="eyebrow">CHAPTER CMS</p><h1 th:text="${novel.title}"></h1><p class="muted">Danh sách chương của tác phẩm</p></div><a class="button button-primary" th:href="@{/admin/novels/{id}/chapters/new(id=${novel.id})}">＋ Tạo chương</a></div>
        <div th:if="${successMessage}" class="alert success" th:text="${successMessage}"></div>
        <section class="table-panel">
            <div class="table-caption"><div><h2>Mục lục chương</h2><span class="muted" th:text="${#lists.size(chapters) + ' chương'}"></span></div></div>
            <div class="table-wrap"><table><thead><tr><th>Số chương</th><th>Tiêu đề</th><th>Trạng thái</th><th>Loại</th><th>Thao tác</th></tr></thead><tbody>
                <tr th:each="chapter : ${chapters}"><td class="chapter-number" th:text="${chapter.chapterNumber}"></td><td><strong th:text="${chapter.title}"></strong><span class="chapter-preview" th:text="${chapter.content}"></span></td><td><span class="status" th:text="${chapter.status == 'DRAFT' ? 'Bản nháp' : chapter.status}"></span></td><td th:text="${chapter.price == 0 ? 'Miễn phí' : chapter.price + ' Coin'}"></td><td class="actions"><a class="icon-button" title="Chỉnh sửa chương" th:href="@{/admin/novels/{novelId}/chapters/{chapterId}/edit(novelId=${novel.id}, chapterId=${chapter.id})}">✎</a><form th:action="@{/admin/novels/{novelId}/chapters/{chapterId}/delete(novelId=${novel.id}, chapterId=${chapter.id})}" method="post" onsubmit="return confirm('Xóa mềm chương này?');"><button class="icon-button danger" title="Xóa chương" type="submit">⌫</button></form></td></tr>
                <tr th:if="${#lists.isEmpty(chapters)}"><td class="empty" colspan="5">Novel chưa có chương nào.</td></tr>
            </tbody></table></div>
        </section>
    </main>
</div>
</body>
</html>
