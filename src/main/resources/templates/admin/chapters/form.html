<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | Trạm Truyện'">Tạo chương | Trạm Truyện</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/novel-admin.css}">
</head>

<body>
    <div th:replace="~{admin/fragments/layout :: sidebar('truyen')}"></div>

    <main class="page-shell chapter-page-shell">
        <section class="content chapter-editor-content">
            <div class="form-shell chapter-editor-page">
                <a class="back-link" th:href="@{/admin/novels/{id}/chapters(id=${novel.id})}">← Quay lại mục lục</a>
                <div class="form-heading">
                    <p class="eyebrow">CHAPTER CMS</p>
                    <h1 th:text="${pageTitle}">Tạo chương mới</h1>
                    <p class="muted">Tác phẩm: <strong th:text="${novel.title}"></strong></p>
                </div>

                <form class="novel-form chapter-form" method="post" th:action="${formAction}" th:object="${chapterForm}"
                    data-chapter-form>
                    <div class="form-grid chapter-fields">
                        <div class="form-field">
                            <label for="chapterNumber">Số chương</label>
                            <input id="chapterNumber" type="number" min="1" th:field="*{chapterNumber}"
                                placeholder="Ví dụ: 1">
                            <small class="field-error" th:errors="*{chapterNumber}"></small>
                        </div>
                        <div class="form-field">
                            <label for="chapterTitle">Tiêu đề chương</label>
                            <input id="chapterTitle" th:field="*{title}" placeholder="Ví dụ: Khởi đầu">
                            <small class="field-error" th:errors="*{title}"></small>
                        </div>
                    </div>

                    <div class="form-field chapter-content-field">
                        <label for="chapterContentEditor">Nội dung chương</label>
                        <div class="rich-editor" data-rich-editor>
                            <div class="editor-toolbar" role="toolbar" aria-label="Công cụ định dạng nội dung">
                                <div class="toolbar-group" aria-label="Định dạng chữ">
                                    <button type="button" data-command="bold" aria-label="Đậm" title="Đậm">B</button>
                                    <button type="button" data-command="italic" aria-label="Nghiêng" title="Nghiêng">I</button>
                                    <button type="button" data-command="underline" aria-label="Gạch chân" title="Gạch chân">U</button>
                                    <button type="button" data-command="strikeThrough" aria-label="Gạch ngang" title="Gạch ngang">S</button>
                                </div>
                                <div class="toolbar-group" aria-label="Kiểu chữ">
                                    <select data-command="formatBlock" aria-label="Kiểu đoạn" title="Kiểu đoạn">
                                        <option value="p">Đoạn văn</option>
                                        <option value="h2">Tiêu đề lớn</option>
                                        <option value="h3">Tiêu đề nhỏ</option>
                                        <option value="blockquote">Trích dẫn</option>
                                    </select>
                                    <select data-command="fontName" aria-label="Font chữ" title="Font chữ">
                                        <option value="Arial">Arial</option>
                                        <option value="Georgia">Georgia</option>
                                        <option value="Tahoma">Tahoma</option>
                                        <option value="Times New Roman">Times New Roman</option>
                                        <option value="Verdana">Verdana</option>
                                    </select>
                                    <div class="font-size-control">
                                        <select data-font-size aria-label="Cỡ chữ" title="Cỡ chữ">
                                            <option value="">Cỡ chữ</option>
                                            <option value="8">8 px</option>
                                            <option value="10">10 px</option>
                                            <option value="12">12 px</option>
                                            <option value="14">14 px</option>
                                            <option value="16">16 px</option>
                                            <option value="18">18 px</option>
                                            <option value="20">20 px</option>
                                            <option value="24">24 px</option>
                                            <option value="28">28 px</option>
                                            <option value="32">32 px</option>
                                            <option value="36">36 px</option>
                                            <option value="48">48 px</option>
                                            <option value="72">72 px</option>
                                            <option value="96">96 px</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="toolbar-group" aria-label="Danh sách">
                                    <button type="button" data-command="insertUnorderedList" title="Danh sách">• List</button>
                                    <button type="button" data-command="insertOrderedList" title="Danh sách đánh số">1. List</button>
                                </div>
                                <div class="toolbar-group" aria-label="Căn chỉnh">
                                    <button type="button" data-command="justifyLeft" title="Căn trái">←</button>
                                    <button type="button" data-command="justifyCenter" title="Căn giữa">↔</button>
                                    <button type="button" data-command="justifyRight" title="Căn phải">→</button>
                                </div>
                                <div class="toolbar-group toolbar-group-last" aria-label="Khác">
                                    <button type="button" data-command="removeFormat" title="Xóa định dạng">Tx</button>
                                    <button type="button" data-source-toggle aria-pressed="false" title="Chỉnh HTML">HTML</button>
                                </div>
                            </div>
                            <div id="chapterContentEditor" class="editor-surface" contenteditable="true"
                                style="font-size: 16px;" data-editor-surface data-placeholder="Nhập nội dung chương..."
                                th:utext="*{content}"></div>
                            <textarea class="editor-source" th:field="*{content}" rows="18"
                                data-editor-source aria-label="HTML nội dung chương"></textarea>
                        </div>
                        <small class="field-error" th:errors="*{content}"></small>
                    </div>

                    <p class="form-note">Chương mới được lưu ở trạng thái Bản nháp và miễn phí. Thiết lập xuất bản hoặc VIP thuộc chức năng riêng.</p>
                    <div class="form-actions chapter-form-actions">
                        <a class="button button-secondary" th:href="@{/admin/novels/{id}/chapters(id=${novel.id})}">Hủy</a>
                        <button class="button button-primary" type="submit" name="saveAction" value="DRAFT"
                            th:text="${pageTitle == 'Tạo chương mới' ? 'Lưu bản nháp' : 'Lưu thay đổi'}">Lưu bản nháp</button>
                        <button class="button button-publish" type="submit" name="saveAction" value="PUBLISHED"
                            th:text="${pageTitle == 'Tạo chương mới' ? 'Xuất bản' : 'Lưu và xuất bản'}">Xuất bản</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <script th:src="@{/js/admin/chapter-editor.js}"></script>
</body>

</html>
