<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý truyện | Trạm Truyện</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/novel-admin.css}">
</head>

<body>
    <div th:replace="~{admin/fragments/layout :: sidebar('truyen')}"></div>

    <main class="page-shell">
        <section class="content novels-page">
            <div class="page-heading">
                <div>
                    <p class="eyebrow">THƯ VIỆN TÁC PHẨM</p>
                    <h1>Quản lý truyện</h1>
                    <p class="muted">Tạo, chỉnh sửa và kiểm soát các tác phẩm đang phát hành.</p>
                </div>
                <a class="button button-primary" th:href="@{/admin/novels/new}">＋ Tạo truyện</a>
            </div>

            <div th:if="${successMessage}" class="alert success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert error" th:text="${errorMessage}"></div>

            <form class="toolbar" method="get" th:action="@{/admin/novels}">
                <label class="search-box">
                    <span>⌕</span>
                    <input name="query" th:value="${query}" placeholder="Tìm theo tên truyện hoặc tác giả...">
                </label>
                <select name="status" aria-label="Lọc trạng thái">
                    <option value="" th:selected="${status == ''}">Tất cả trạng thái</option>
                    <option value="ONGOING" th:selected="${status == 'ONGOING'}">Đang ra</option>
                    <option value="COMPLETED" th:selected="${status == 'COMPLETED'}">Hoàn thành</option>
                    <option value="ON_HOLD" th:selected="${status == 'ON_HOLD'}">Tạm ngưng</option>
                    <option value="ARCHIVED" th:selected="${status == 'ARCHIVED'}">Lưu trữ</option>
                </select>
                <button class="button button-secondary" type="submit">Lọc danh sách</button>
            </form>

            <section class="table-panel">
                <div class="table-caption">
                    <div>
                        <h2>Danh sách tác phẩm</h2>
                        <span class="muted" th:text="${#lists.size(novels) + ' tác phẩm đang quản lý'}"></span>
                    </div>
                </div>

                <div class="table-wrap">
                    <table class="novel-table">
                        <thead>
                            <tr>
                                <th>Tác phẩm</th>
                                <th>Tác giả</th>
                                <th>Trạng thái</th>
                                <th>Đánh giá</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="novel : ${novels}">
                                <td class="novel-cell">
                                    <div class="novel-cell-content">
                                        <img th:src="${novel.coverUrl != null ? novel.coverUrl : '/images/default-cover.jpg'}"
                                            th:alt="${novel.title}">
                                        <div class="novel-details">
                                            <strong th:text="${novel.title}"></strong>
                                            <span th:text="${novel.summary}"></span>
                                        </div>
                                    </div>
                                </td>
                                <td class="author-cell" th:text="${novel.author}"></td>
                                <td>
                                    <span class="status"
                                        th:classappend="${novel.status == 'COMPLETED' ? ' done' : (novel.status == 'ON_HOLD' ? ' paused' : '')}"
                                        th:text="${novel.status == 'ONGOING' ? 'Đang ra' : (novel.status == 'COMPLETED' ? 'Hoàn thành' : (novel.status == 'ON_HOLD' ? 'Tạm ngưng' : 'Lưu trữ'))}"></span>
                                </td>
                                <td class="rating-cell">
                                    <span class="rating">★ <b th:text="${novel.averageRating}"></b></span>
                                    <small th:text="${novel.views + ' lượt đọc'}"></small>
                                </td>
                                <td>
                                    <div class="actions">
                                        <a class="action-button" title="Quản lý chương"
                                            th:href="@{/admin/novels/{id}/chapters(id=${novel.id})}">
                                            <span aria-hidden="true">▤</span> Chương
                                        </a>
                                        <a class="action-button" title="Chỉnh sửa"
                                            th:href="@{/admin/novels/{id}/edit(id=${novel.id})}">
                                            <span aria-hidden="true">✎</span> Sửa
                                        </a>
                                        <form th:action="@{/admin/novels/{id}/delete(id=${novel.id})}" method="post"
                                            onsubmit="return confirm('Xóa mềm tác phẩm này?');">
                                            <button class="action-button danger" title="Xóa" type="submit">
                                                <span aria-hidden="true">⌫</span> Xóa
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(novels)}">
                                <td class="empty" colspan="5">Chưa có tác phẩm phù hợp.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </section>
    </main>
</body>

</html>
