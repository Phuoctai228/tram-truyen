<!DOCTYPE html>
<html lang="vi" class="h-full" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu - Trạm Truyện</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/authentication/tailwind-config.js}"></script>
</head>
<body class="min-h-full flex flex-col bg-surface text-on-surface">

<div th:replace="~{fragments/header :: main-header}"></div>

<main class="flex-1 w-full pt-[72px] bg-surface flex flex-col justify-center items-center px-margin">
    <div class="flex flex-col w-full items-center justify-center py-space-xl relative overflow-hidden">
        
        <div class="absolute -top-32 -left-24 w-96 h-96 rounded-full bg-primary-fixed/20 blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-32 -right-24 w-96 h-96 rounded-full bg-secondary-fixed/25 blur-3xl pointer-events-none"></div>
        
        <div class="relative w-full max-w-[440px] bg-surface-container-lowest rounded-xl p-[36px] shadow-[0_10px_25px_-5px_rgba(43,33,24,0.05),0_8px_10px_-6px_rgba(43,33,24,0.03)] border border-outline-variant">
            
            <div class="flex items-center justify-center gap-2 mb-3">
                <span class="w-[40px] h-[1px] bg-outline-variant inline-block"></span>
                <span class="w-1.5 h-1.5 rounded-full bg-primary-container inline-block"></span>
                <span class="w-[40px] h-[1px] bg-outline-variant inline-block"></span>
            </div>
            
            <h1 class="font-headline-lg text-headline-lg text-on-surface text-center mb-1.5 tracking-normal">
                Tạo mật khẩu mới
            </h1>
            <p class="font-body-md text-body-md text-tertiary text-center mb-6">
                Mật khẩu phải có ít nhất 8 ký tự và chứa ít nhất một chữ hoa.
            </p>

            <div th:if="${errorMessage}" class="mb-4 p-3 text-sm text-on-error-container bg-error-container rounded-lg border border-error/20" role="alert">
                <span th:text="${errorMessage}">Lỗi.</span>
            </div>

            <form th:action="@{/forgot-password/reset}" method="post" class="flex flex-col gap-4">
                
                <div class="flex flex-col">
                    <label class="font-label-md text-label-md text-on-surface font-semibold mb-1.5" for="newPassword">
                        Mật khẩu mới
                    </label>
                    <div class="relative flex items-center">
                        <span class="material-symbols-outlined absolute left-3.5 text-tertiary text-[20px] pointer-events-none select-none">lock</span>
                        <input name="newPassword" id="newPassword" type="password" required placeholder="Nhập mật khẩu mới"
                               class="w-full h-[44px] pl-10 pr-11 bg-surface-container-lowest rounded-[10px] border border-outline-variant font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all">
                    </div>
                </div>

                <div class="flex flex-col">
                    <label class="font-label-md text-label-md text-on-surface font-semibold mb-1.5" for="confirmPassword">
                        Xác nhận mật khẩu
                    </label>
                    <div class="relative flex items-center">
                        <span class="material-symbols-outlined absolute left-3.5 text-tertiary text-[20px] pointer-events-none select-none">lock</span>
                        <input name="confirmPassword" id="confirmPassword" type="password" required placeholder="Nhập lại mật khẩu"
                               class="w-full h-[44px] pl-10 pr-11 bg-surface-container-lowest rounded-[10px] border border-outline-variant font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all">
                    </div>
                </div>

                <button type="submit" class="w-full h-[46px] mt-2 rounded-[10px] bg-primary-container hover:bg-primary text-on-primary font-label-lg text-label-lg font-semibold shadow-[0_2px_6px_rgba(208,138,46,0.25)] hover:shadow-md transition-all active:scale-[0.99] flex items-center justify-center">
                    Cập nhật mật khẩu
                </button>
            </form>

            <div class="mt-5 text-center font-body-md text-body-md text-tertiary">
                <a th:href="@{/login}" class="text-primary-container font-semibold hover:underline ml-1 transition-colors">Quay lại đăng nhập</a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: main-footer}"></div>

</body>
</html>
